<style>
/* Layout: puhelin ensin (9:16), yksi palsta max 520px, iOS-tyylinen alapalkki. Kalkkikivi & pergamentti päivällä, Negevin yö illalla. */
:root{
  --bg:#F5F8FD; --bg2:#E9EFF9; --card:#FFFFFF; --card2:#EEF3FB; --ink:#13203A; --soft:#38486A; --muted:#6F7E9C; --line:#DCE4F1;
  --blue:#1E4FA3; --blue2:#3A6FD0; --olive:#3A6FD0; --sun:#9C7A2C; --gold:#C9A24A; --goldink:#8C6B1F; --goldsoft:rgba(201,162,74,.16); --bluesoft:rgba(30,79,163,.08);
  --ok:#2E7D5B; --okbg:rgba(46,125,91,.11); --bad:#C2413A; --badbg:rgba(194,65,58,.09);
  --shadow:0 1px 0 rgba(19,32,58,.04),0 10px 26px -16px rgba(30,79,163,.32);
  --ui:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --he:"Noto Serif Hebrew","Frank Ruhl Libre","Times New Roman","Arial Hebrew",serif;
  --tabh:60px; color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{background:linear-gradient(180deg,#FFFFFF 0,var(--bg) 340px) no-repeat,var(--bg)}
body{color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
.he{font-family:var(--he);direction:rtl;unicode-bidi:isolate;line-height:1.9;letter-spacing:0;font-feature-settings:"kern"}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 26px);min-height:100%}
.view{display:flex;flex-direction:column;gap:14px;padding-top:8px;animation:vin .28s ease}
@keyframes vin{from{opacity:.55;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);display:flex;align-items:center;gap:10px;min-height:54px}
.top h2{font-size:26px;font-weight:800;flex:1;min-width:0}
.back{background:none;border:0;color:var(--blue);font-size:16px;font-weight:600;cursor:pointer;padding:4px 0;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--ink)}
.pg{font-size:12px;font-weight:700;color:var(--goldink);background:var(--goldsoft);border-radius:8px;padding:3px 8px;white-space:nowrap}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:19px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.btn{border:0;border-radius:15px;padding:14px 16px;font-size:16.5px;font-weight:700;cursor:pointer;text-align:center;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:#fff}
.btn.gold{background:linear-gradient(135deg,#D8B75F,#C9A24A);color:#1A1405}
.btn.sec{background:var(--card2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--blue);padding:10px 6px}
.btn.wide{width:100%}
.row{display:flex;gap:10px}
.row>.btn{flex:1}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{position:relative;padding-left:16px;color:var(--soft);font-size:15px}
.list li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:2px;transform:rotate(45deg);background:var(--gold)}
.list li b{color:var(--ink)}
.list .he{font-size:1.15em;line-height:1.5}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card2);border:0;border-radius:99px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--soft);white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.chip.lk{outline:1.5px dashed var(--line)}
.chip:disabled{opacity:.35}
input.search,input.tx{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--blue)}
.tabs button[aria-selected="true"] svg{stroke:var(--blue)}
/* home */
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 0 6px}
.star{width:74px;height:74px}
.star path{fill:none;stroke:var(--gold);stroke-width:4.2;stroke-linejoin:round;stroke-dasharray:330;stroke-dashoffset:0;animation:draw 1.6s ease both}
.star path+path{animation-delay:.35s}
@keyframes draw{from{stroke-dashoffset:330}to{stroke-dashoffset:0}}
.wordmark{font-size:30px;font-weight:800;letter-spacing:.14em;line-height:1.05;color:var(--blue)}
.wordmark span{color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:14px}
.grade{display:flex;align-items:center;gap:16px}
.grade .num{font-size:58px;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--blue);font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.grade .num.unk{font-size:34px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:46px}
.bars div{background:var(--card2);border-radius:5px;position:relative;height:100%;overflow:hidden}
.bars i{position:absolute;inset:auto 0 0 0;background:linear-gradient(var(--gold),var(--blue2));border-radius:5px}
.barlbl{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rec{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.rec:first-of-type{border-top:0}
.rec .dot{width:10px;height:10px;border-radius:50%;flex:none}
.rec .tx{flex:1;min-width:0}
.rec b{display:block;font-size:15px}
.rec span{font-size:13px;color:var(--muted)}
/* grids */
.gm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gm button{background:var(--card);box-shadow:var(--shadow);border:0;border-radius:20px;padding:15px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:122px;position:relative;transition:transform .1s}
.gm button:active{transform:scale(.98)}
.gm .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--he);font-size:22px;line-height:1;color:#fff}
.gm b{font-size:16px}
.gm span{font-size:12.5px;color:var(--muted);line-height:1.3}
.gm .best{position:absolute;top:13px;right:13px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gm .wide{grid-column:span 2;min-height:0;flex-direction:row;align-items:center;gap:14px}
.gm .wide div{display:flex;flex-direction:column;gap:2px}
/* chapters */
.chap{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border:0;border-radius:18px;padding:14px;cursor:pointer;text-align:left;width:100%}
.chap .n{min-width:38px;height:38px;padding:0 4px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--bluesoft);color:var(--blue);flex:none;font-variant-numeric:tabular-nums}
.chap .tt{flex:1;min-width:0}
.chap .tt b{display:block;font-size:15.5px;line-height:1.3}
.chap .tt span{font-size:12.5px;color:var(--muted)}
.chap .prog{width:46px;height:6px;border-radius:6px;background:var(--card2);overflow:hidden;flex:none}
.chap .prog i{display:block;height:100%;background:var(--olive)}
.chap.locked{opacity:.62}
.lock{font-size:12px;color:var(--muted);white-space:nowrap}
.topic .hd{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.topic .ex{display:flex;flex-direction:column;gap:4px;background:var(--card2);border-radius:14px;padding:10px 14px}
.topic .ex .he{font-size:26px;text-align:right}
.topic .ex span{font-size:13.5px;color:var(--soft)}
.mbar{height:5px;border-radius:5px;background:var(--card2);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--olive);transition:width .4s}
/* game */
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud .sp{flex:1}
.bar{height:5px;background:var(--card2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--gold));transition:width .35s}
.stage{display:flex;flex-direction:column;gap:14px;min-height:58vh}
.qtag{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--goldink)}
.q{font-size:20px;font-weight:700;line-height:1.3}
.bighe{font-family:var(--he);direction:rtl;font-size:clamp(44px,13vw,64px);line-height:1.75;text-align:center;padding:12px 8px 6px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.bighe.mid{font-size:clamp(30px,9vw,42px)}
.bighe .tr{display:block;font-family:var(--ui);direction:ltr;font-size:15px;color:var(--muted);line-height:1.3;padding-bottom:6px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--card);box-shadow:var(--shadow);border:1.5px solid transparent;border-radius:16px;padding:14px 16px;text-align:left;font-size:16px;line-height:1.35;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{cursor:default}
.opt.he{font-size:24px;text-align:right;line-height:1.7;padding:8px 16px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.sel{border-color:var(--gold)}
.opt.used{opacity:.38}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fb{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;animation:pop .25s ease}
.fb.ok{background:var(--okbg)} .fb.no{background:var(--badbg)}
.fb b.t{font-size:16px}
.fb.ok b.t{color:var(--ok)} .fb.no b.t{color:var(--bad)}
.fb p{font-size:14.5px;color:var(--soft)}
.fb .he{font-size:22px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.end{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-top:18px}
.end .big{font-size:76px;font-weight:800;line-height:1;letter-spacing:-.05em;color:var(--blue)}
.end p{color:var(--soft);max-width:34ch}
/* keyboard */
.answer{min-height:64px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 14px;font-family:var(--he);font-size:32px;line-height:1.8;direction:rtl;text-align:right;display:flex;align-items:center;justify-content:flex-start;gap:2px;flex-wrap:wrap;cursor:text}
.answer.focus{border-color:var(--blue)}
.answer .caret{width:2px;height:34px;background:var(--blue);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.answer .ph{font-family:var(--ui);font-size:14px;color:var(--muted);direction:ltr}
input.native{font-family:var(--he);font-size:28px;direction:rtl;text-align:right;line-height:1.8;padding:6px 14px}
.kb{display:flex;flex-direction:column;gap:6px;background:var(--bg2);border-radius:18px;padding:8px;margin-inline:-6px;user-select:none;-webkit-user-select:none}
.kb .r{display:flex;gap:5px;direction:rtl}
.kb button{flex:1;min-width:0;border:0;border-radius:9px;background:var(--card);box-shadow:0 1px 0 rgba(0,0,0,.12);font-family:var(--he);font-size:21px;line-height:1;padding:10px 0 9px;cursor:pointer}
.kb button:active{background:var(--goldsoft);transform:translateY(1px)}
.kb button.nq{font-size:24px;color:var(--sun)}
.kb button.fn{font-family:var(--ui);font-size:13px;font-weight:700;flex:1.6}
.kb .r.ltr{direction:ltr}
.kbbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* build */
.slots{display:flex;gap:6px;direction:rtl;justify-content:center;flex-wrap:wrap;min-height:66px;padding:6px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.slots span{font-family:var(--he);font-size:34px;width:44px;height:56px;border-radius:12px;display:grid;place-items:center;background:var(--card2);line-height:1}
.slots span.f{background:var(--goldsoft)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:rtl}
.tiles button{font-family:var(--he);font-size:30px;width:52px;height:58px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);cursor:pointer;line-height:1}
.tiles button:disabled{opacity:.25}
/* flash */
.flip{perspective:1400px;cursor:pointer}
.flip-in{position:relative;height:min(46vh,340px);transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:8px;background:var(--card);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--card2)}
.face .he{font-size:clamp(46px,14vw,66px);line-height:1.7}
.face .hint{font-size:13px;color:var(--muted)}
.face .fi{font-size:21px;font-weight:700}
/* reading */
.reader{display:flex;flex-wrap:wrap;gap:6px 10px;direction:rtl;justify-content:flex-start;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.reader button{font-family:var(--he);font-size:30px;line-height:1.75;background:none;border:0;border-radius:10px;padding:0 4px;cursor:pointer;color:var(--ink)}
.reader button.on{background:var(--goldsoft);color:var(--gold)}
.gloss{background:var(--card2);border-radius:16px;padding:12px 14px;min-height:74px;display:flex;flex-direction:column;gap:3px}
.gloss b{font-size:17px}
/* vocab */
.vrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:6px 14px;border:0;width:100%;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.vrow .he{font-size:27px;min-width:96px;text-align:right}
.vrow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.vrow .t b{font-size:15px;font-weight:700}
.vrow .t span{font-size:12.5px;color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:8px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(19,32,58,.38);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:86vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 6px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw{width:50px;height:30px;border-radius:30px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--olive)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
footer{color:var(--muted);font-size:12px;line-height:1.55;padding-top:20px;text-align:center}
.tbl{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.he{font-size:22px;text-align:right;line-height:1.6}

/* ===== v2 ===== */
.brand{padding:22px 0 2px}
.brand .star{width:64px;height:64px}
.btn.small{padding:9px 12px;font-size:14px;border-radius:12px}
.row.wrap{flex-wrap:wrap}
.row.wrap>.btn{flex:1 1 auto}
.btnpill{border:0;cursor:pointer}
.pill.prac{background:var(--okbg);color:var(--ok)}
.mascot{display:flex;gap:10px;align-items:flex-end;text-align:left;width:100%}
.mface{width:54px;height:54px;flex:none;animation:bob 3.2s ease-in-out infinite}
.mface svg{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-3px) rotate(-2deg)}}
.bubble{position:relative;background:var(--card);border:1.5px solid var(--goldsoft);box-shadow:var(--shadow);border-radius:18px 18px 18px 6px;padding:10px 13px;font-size:14.5px;line-height:1.4;color:var(--soft);display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.bubble .mname{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--goldink)}
.bubble .he{font-size:1.15em;line-height:1.5}

        if(k.v==="ַ" && i===n-1 && "חעה".includes(c) && i>0 && prevVowel){ out.pop(); out.push("a"+(forte?s+s:s)); prevVowel=false; continue; }
        out.push(k.jer? "aji" : vv);
        prevVowel=!!vv;
      } else prevVowel=false;
    }
    let r=out.join("");
    const EXC={"חָכְמָה":"ḥoḵmā","אָכְלָה":"ʾoḵlā","כָּל־":"kol-","כָּל":"kol","יְהוָה":"JHWH (luetaan ʾădōnāj)","רִאשׁוֹן":"rīšōn","לֵאמֹר":"lēʾmōr","יִשַׁי":"jišaj"};
    if(EXC[wd]) return EXC[wd];
    r=r.replace(/ʾ(?=$)/,"");
    if(exc && exc[wd]) return exc[wd];
    return r;
  }
  function isVocalShewa(cl,i){
    const k=cl[i]; if(!k||k.v!=="ְ") return false;
    if(i===0) return true;
    if(i===cl.length-1) return false;
    const pv=cl[i-1];
    if(pv.v==="ְ") return true; // toinen kahdesta šewasta
    if(k.dag && pv.v) return true; // kahdennettu
    if(cl[i+1] && cl[i+1].c===k.c) return true;
    // pitkän vokaalin jälkeen (yksinkertaistus: ā ē ō ū ī)
    if(["ָ","ֵ","ֹ"].includes(pv.v) && !k.dag) return true;
    return false;
  }
  function text(t,exc){ return t.split(/(\s+|־)/).map(p=>/\s+|־/.test(p)?(p==="־"?"-":p):word(p,exc)).join(""); }
  return {word,text};
})();

 deep:"Kun näet kaksi sanaa peräkkäin, tarkista, onko molemmilla sama artikkelitilanne. Jos pääsanalla on artikkeli, myös adjektiivilla on. Silloin kyse on attribuutista (’se hyvä hevonen’). Jos adjektiivilta artikkeli puuttuu, kyse voi olla nominaalilauseesta (luku 4).",
 pre:["gender","article"]},
{id:"nominal",ch:4,t:"Nominaalilause",pg:"42–44",
 sum:["Nominaalilauseessa ei ole verbiä: ’olla’ ymmärretään asiayhteydestä.","Predikaattiadjektiivi on <b>ilman artikkelia</b>: הַסּוּס טוֹב ’Hevonen on hyvä’, mutta הַסּוּס הַטּוֹב ’hyvä hevonen’.","Sanajärjestys on vapaa. Predikaattina voi olla myös substantiivi (דָּוִד מֶלֶךְ) tai adverbi.","Kielto: <b>אֵין</b> ’ei ole’: אֵין מֶלֶךְ ’ei ole kuningasta’."],
 ex:[["אַתָּה הָאִישׁ","Sinä olet se mies (2. Sam. 12:7)"]],
 deep:"Kysy: onko adjektiivilla sama artikkeli kuin substantiivilla? Jos on → attribuutti (ei lausetta). Jos ei ole → nominaalilause (’X on Y’). Suomeen lisätään aina ’on/oli’.",
 pre:["attr"]},
{id:"waw",ch:4,t:"Ja-sana",pg:"45–47",
 sum:["’Ja’ on וְ, ja se liitetään seuraavaan sanaan.","Šewan edellä ja ennen kirjaimia ב מ פ (bumaf) se on <b>וּ</b>: וּשְׁמוּאֵל, וּבֵן.","Ḥatef-vokaalin edellä וְ saa vastaavan täysvokaalin: וַאֲנִי. Ennen יְ: וִיהוּדָה.","Painollisen tavun edellä usein וָ: טוֹב וָרָע."],
 ex:[["אָח וְאָחוֹת","veli ja sisko"],["בָּנִים וּבָנוֹת","poikia ja tyttäriä"]],
 deep:"Perussääntö on וְ. Muuta muoto vain, jos seuraava sana alkaa šewalla tai kirjaimella ב, מ, פ, jolloin se on וּ (koska tavu ei voi alkaa kahdella konsonantilla).",
 pre:["shewa"]},
{id:"preps",ch:5,t:"Prepositiot בְּ, לְ ja כְּ",pg:"48–50",
 sum:["בְּ ’-ssa, -lla, avulla’, לְ ’-lle, jollekin, jonkun omistama’, כְּ ’kuin’. Liitetään sanaan kiinni.","Šewan edellä: בִּ, לִ, כִּ (לִשְׁמוּאֵל). Ḥatef-vokaalin edellä vastaava täysvokaali (בַּאֲנִי).","<b>Artikkelin kanssa</b> ה katoaa ja prepositio saa artikkelin vokaalin: לַמֶּלֶךְ, בָּעִיר, כָּאִישׁ.","Sulautumat: לֵאמֹר ’sanoen’, לֵאלֹהִים ’Jumalalle’."],
 ex:[["בַּמָּקוֹם","paikassa (määr.)"],["לְדָוִד","Daavidille / Daavidin"]],
 deep:"Kirjoita ensin mielessäsi prepositio + artikkeli + sana: לְ + הַ + מֶּלֶךְ. Pudota sitten ה pois, jolloin prepositio perii sen vokaalin: לַמֶּלֶךְ. Dageš jää paikalleen. Siksi ’kuninkaalle’ ja ’kuningas’ (määr.) näyttävät niin samalta.",
 pre:["article","shewa"]},
{id:"prep2",ch:5,t:"Kaksikonsonanttiset prepositiot ja מִן",pg:"50–51",
 sum:["אֶל ’johonkin, luokse’, עַל ’päällä, -lla, koskien’, עִם ’kanssa’, אֵת/אֶת־ ’kanssa’, מִן ’-sta, jostakin’.","מִן sulautuu seuraavaan sanaan: נ katoaa ja seuraava konsonantti kahdentuu: מִמֶּלֶךְ.","Laryngaalin ja ר:n edellä kahdennus korvautuu pidennyksellä: מֵאִישׁ, מֵהָעִיר. Usein myös מִן־הָעִיר."],
 ex:[["מִן־הָעִיר","kaupungista"]],
 deep:"מִן käyttäytyy kuin artikkeli: nūn ’hyppää’ seuraavaan kirjaimeen kahdennukseksi. Jos kirjain ei kahdennu (א ה ח ע ר), vokaali pitenee i → ē (מֵ).",
 pre:["preps","dagesh"]},
{id:"compar",ch:5,t:"Vertailuasteet",pg:"51–53",
 sum:["Hepreassa ei ole erillisiä komparatiivimuotoja.","Komparatiivi ilmaistaan <b>מִן</b>-prepositiolla: טוֹב ... מִן ’parempi kuin’.","Superlatiivi ilmaistaan esim. artikkelilla tai omistusrakenteella: הַקָּטֹן ’pienin’, קֹדֶשׁ קָדָשִׁים ’kaikkein pyhin’."],
 ex:[["גָּדוֹל הַמֶּלֶךְ מִן־הָעָם","Kuningas on suurempi kuin kansa"]],
 deep:"Lue מִן vertailussa sanalla ’verrattuna’: ’kuningas on suuri verrattuna kansaan’ = suurempi kuin kansa.",
 pre:["prep2","nominal"]},
{id:"verbal",ch:6,t:"Verbaalilause",pg:"54–58",
 sum:["Verbaalilauseen predikaatti on finiittiverbi. Tavallinen järjestys: <b>verbi – subjekti – objekti</b>.","Verbin muoto kertoo persoonan, suvun ja luvun.","Määräistä objektia edeltää usein <b>objektin merkki</b> אֵת / אֶת־: וַיִּקַּח אֶת־הַסֵּפֶר."],
 ex:[["וַיֹּאמֶר אֱלֹהִים","Ja Jumala sanoi"]],
 deep:"Kun luet lausetta, etsi ensin verbi (usein lauseen alussa), sitten subjekti ja lopuksi אֶת־, joka näyttää objektin. אֵת ei käänny suomeksi: se on vain merkki ’tämä on kohde’.",
 pre:["nominal"]},
{id:"commonverbs",ch:6,t:"Tavallisimmat verbit",pg:"55",
 sum:["Kertovissa teksteissä yleisimmät muodot ovat perfekti yks. 3. mask. ja konsekutiivinen imperfekti yks. 3. mask.","אָמַר / וַיֹּאמֶר sanoa · הָיָה / וַיְהִי olla · עָשָׂה / וַיַּעַשׂ tehdä · הָלַךְ / וַיֵּלֶךְ mennä","בָּא / וַיָּבֹא tulla · יָצָא / וַיֵּצֵא lähteä · נָתַן / וַיִּתֵּן antaa · לָקַח / וַיִּקַּח ottaa"],
 ex:[["וַיְהִי","ja tapahtui, ja hän oli"]],
 deep:"Näitä kahdeksaa ei tarvitse vielä osata taivuttaa, ne riittää tunnistaa. Muista ’ja’-muodot וַיּ־ -alun perusteella: וַיֹּאמֶר = ’ja hän sanoi’. Opettele parit kortteina.",
 pre:["verbal"]},
{id:"pron",ch:7,t:"Persoonapronominit",pg:"59",
 sum:["minä אֲנִי / אָנֹכִי · sinä (m) אַתָּה · sinä (f) אַתְּ · hän (m) הוּא · hän (f) הִיא","me אֲנַחְנוּ · te (m) אַתֶּם · te (f) אַתֵּן · he (m) הֵם / הֵמָּה · he (f) הֵנָּה","Itsenäisiä pronomineja käytetään vain subjektina ja nominaalilauseen predikaattina. Omistus ja objekti ilmaistaan suffikseilla (luku 9)."],
 ex:[["אֲנִי יְהוָה","Minä olen Herra"]],
 deep:"Pronominit kannattaa oppia pareina: אַתָּה/אַתְּ (sinä m/f), אַתֶּם/אַתֵּן (te m/f), הֵם/הֵנָּה (he m/f). Huomaa toistuvat äänteet: t-äänne on 2. persoonassa (att-), h 3. persoonassa (hū, hī, hēm).",
 pre:[]},
{id:"demo",ch:7,t:"Demonstratiivit ja indefiniitit",pg:"60–61",
 sum:["זֶה ’tämä’ (m), זֹאת ’tämä’ (f), אֵלֶּה ’nämä’. הוּא/הִיא/הֵם/הֵנָּה = ’se, tuo, ne’.","Attribuuttina demonstratiivi saa artikkelin, jos pääsana on määräinen: הַיּוֹם הַזֶּה ’tämä päivä’, בַּיּוֹם הַהוּא ’sinä päivänä’.","Indefiniitit ilmaistaan substantiiveilla: אִישׁ ’joku’, דָּבָר ’jokin’, כָּל־ ’kaikki’."],
 ex:[["מִי עָשָׂה זֹאת","Kuka teki tämän?"]],
 deep:"Jos זֶה on ilman artikkelia, se on lause: זֶה הֶבֶל ’Tämä on turhuutta’. Artikkelin kanssa pääsanan perässä se on attribuutti: הַדָּבָר הַזֶּה ’tämä asia’. Sama sääntö kuin adjektiiveilla.",
 pre:["pron","attr"]},
{id:"quest",ch:7,t:"Kysymyspartikkeli ja kysymyssanat",pg:"62–64",
 sum:["Kysymyspartikkeli <b>הֲ</b> lauseen alussa tekee lauseesta kyllä/ei-kysymyksen: הֲשֹׁמֵר אָחִי אָנֹכִי ’Olenko minä veljeni vartija?’","Ennen šewaa ja laryngaalia muoto on usein הַ.","Kysymyssanat: מִי ’kuka’, מָה ’mikä’, לָמָּה ’miksi’, מֵאַיִן ’mistä’, אַי ’missä’."],
 ex:[["מִי אַתָּה","Kuka sinä olet?"]],
 deep:"Älä sekoita הֲ:ta artikkeliin הַ. Artikkelin jälkeen on dageš, ja se on kiinni substantiivissa. Kysymyspartikkelissa on ḥatef pataḥ (הֲ), ja se on lauseen alussa.",
 pre:["article"]},
{id:"copula",ch:7,t:"Nominaalilauseen kopula",pg:"62",
 sum:["3. persoonan pronomini voi toimia nominaalilauseessa ’on’-sanan tapaan: יְהוָה הוּא הָאֱלֹהִים ’Herra on Jumala’."],
 ex:[["יְהוָה הוּא הָאֱלֹהִים","Herra on (se) Jumala"]],
 deep:"Kun kahden määräisen nominin välissä on הוּא tai הִיא, älä käännä ’hän’. Se korostaa yhteyttä ja vastaa suomen ’on’-sanaa.",
 pre:["pron","nominal"]},
{id:"status",ch:8,t:"Status absolutus ja constructus",pg:"66–67",
 sum:["Hepreassa ei ole genetiiviä. Omistus ilmaistaan <b>status constructus</b> -rakenteella: omistettava (st. cstr.) + omistaja.","Vain viimeinen sana voi saada artikkelin. Jos omistaja on määräinen, koko rakenne on määräinen: בֵּית הַמֶּלֶךְ ’kuninkaan talo’.","בֵּית מֶלֶךְ = ’(erään) kuninkaan talo’. Attribuutti tulee koko ketjun jälkeen."],
 ex:[["דְּבַר יְהוָה","Herran sana"],["בְּנֵי יִשְׂרָאֵל","Israelin pojat, israelilaiset"]],
 deep:"Lue rakenne suomeksi lopusta alkuun: בֵּית הַמֶּלֶךְ = talo + (se) kuningas → ’kuninkaan talo’. Ensimmäinen sana on ’heikossa’ asemassa (constructus): se nojaa seuraavaan, lyhenee usein eikä koskaan saa artikkelia.",
 pre:["article"]},
{id:"cstrforms",ch:8,t:"St. constructus -muodot",pg:"68–69",
 sum:["-ָה → <b>-ַת</b>: מַלְכָּה → מַלְכַּת, תּוֹרָה → תּוֹרַת.","-ִים → <b>-ֵי</b>: סוּסִים → סוּסֵי, בָּנִים → בְּנֵי. Duaali samoin: יָדַיִם → יְדֵי.","-וֹת pysyy: סוּסוֹת → סוּסוֹת. Vokaalit lyhenevät: דָּבָר → דְּבַר, דְּבָרִים → דִּבְרֵי.","Erikoismuotoja: אָב → אֲבִי, אָח → אֲחִי, בַּיִת → בֵּית, בֵּן → בֶּן־, אִשָּׁה → אֵשֶׁת."],
 ex:[["תּוֹרַת מֹשֶׁה","Mooseksen laki"]],
 deep:"Constructus on lyhennetty muoto, koska paino siirtyy seuraavaan sanaan. Opettele kolme päätemuutosta (-ָה → -ַת, -ִים → -ֵי, -ַיִם → -ֵי) ja viisi erikoissanaa. Ne kattavat suurimman osan tapauksista.",
 pre:["status","gender"]},
{id:"circum",ch:8,t:"Omistusrakenteen kiertoilmaus",pg:"70",
 sum:["Jos omistettava on epämääräinen mutta omistaja määräinen, käytetään לְ-prepositiota: בֵּן לְיִשַׁי ’(eräs) Iisain poika’.","Myös אֲשֶׁר לְ ’joka kuuluu jollekin’."],
 ex:[["מִזְמוֹר לְדָוִד","Daavidin psalmi"]],
 deep:"Constructus-rakenne tekee kaikesta määräistä, jos omistaja on määräinen. Kun halutaan sanoa ’eräs Iisain poika’, käytetään kiertotietä: ’poika Iisaille’.",
 pre:["status","preps"]},
{id:"suffn",ch:9,t:"Persoonasuffiksit nomineissa",pg:"77–81",
 sum:["Omistus ilmaistaan päätteellä: סוּסִי minun hevoseni, סוּסְךָ sinun (m), סוּסֵךְ sinun (f), סוּסוֹ hänen (m), סוּסָהּ hänen (f), סוּסֵנוּ meidän, סוּסְכֶם teidän (m), סוּסָם heidän (m).","Monikolliseen sanaan tulee י: סוּסַי, סוּסֶיךָ, סוּסַיִךְ, סוּסָיו, סוּסֶיהָ, סוּסֵינוּ, סוּסֵיכֶם, סוּסֵיהֶם.","Suffiksi liitetään constructus-vartaloon: תּוֹרָה → תּוֹרָתִי.","Suffiksillinen sana on määräinen: attribuutti saa artikkelin: סוּסִי הַטּוֹב."],
 ex:[["אָבִי","isäni"],["תּוֹרָתְךָ","sinun opetuksesi"]],
 deep:"Erota ensin luku: jos ennen päätettä näkyy י (סוּסַי, סוּסָיו), omistettavia on monta. Sitten persoona: -ִי/-ַי minä, -ְךָ/-ֶיךָ sinä (m), -וֹ/-ָיו hän (m), -ָהּ/-ֶיהָ hän (f), -ֵנוּ/-ֵינוּ me, -כֶם te, -ָם/-הֶם he.",
 pre:["pron","cstrforms"]},
{id:"suffp",ch:9,t:"Suffiksit prepositioissa",pg:"81–82",
 sum:["לְ: לִי, לְךָ, לָךְ, לוֹ, לָהּ, לָנוּ, לָכֶם, לָהֶם. בְּ samoin: בִּי, בְּךָ, בּוֹ ...","Objektin merkki: אֹתִי minut, אֹתְךָ sinut, אֹתוֹ hänet, אֹתָהּ hänet (f), אֹתָנוּ meidät, אֶתְכֶם teidät, אֹתָם heidät.","עִם: עִמִּי ’kanssani’. אֶל ja עַל saavat monikkotyyppiset suffiksit: אֵלַי, אֵלָיו, עָלַי, עָלָיו. מִן: מִמֶּנִּי ’minusta’."],
 ex:[["לוֹ","hänelle (m), hänellä"]],
 deep:"Suffiksit ovat samoja kuin nomineissa, mutta ne liittyvät prepositioon. אֶל ja עַל ’teeskentelevät’ olevansa monikossa, siksi niissä on י: אֵלָיו kuten סוּסָיו.",
 pre:["suffn","preps"]},
{id:"root",ch:10,t:"Juuri ja taivutusvartalot",pg:"90–92",
 sum:["Verbin perusmuoto on <b>qal-perfektin yks. 3. mask.</b>: שָׁמַר ’hän vartioi’ → ’vartioida’.","Juuri on yleensä kolme konsonanttia (שׁמר). Johdetut vartalot (nifʿal, piʿʿel, hifʿil ...) tulevat myöhemmin. Nyt opetellaan perusvartalo qal.","Heikko verbi = juuressa on א, ה, ו/י tai נ tai kaksi samaa konsonanttia. Laryngaalit vaikuttavat vokaaleihin. Asema merkitään I, II, III (esim. III-א)."],
 ex:[["שָׁמַרְתִּי","juuri שׁמר + pääte -תִּי"]],
 deep:"Ajattele juurta kuin legopalikoita: kolme konsonanttia pysyy, ja niiden ympärille lisätään vokaaleja ja liitteitä. Kun näet tuntemattoman muodon, poista ensin tutut päätteet ja etuliitteet. Jäljelle jäävät kolme konsonanttia ovat juuri, ja sen löydät sanastosta.",
 pre:[]},
{id:"aspect",ch:10,t:"Perfekti ja imperfekti",pg:"92",
 sum:["<b>Perfekti</b> kuvaa tekoa kokonaisena, päättyneenä: yleensä mennyt aika.","<b>Imperfekti</b> kuvaa keskeneräistä tekoa: tuleva, toistuva tai nykyhetki.","Perfekti taivutetaan päätteillä, imperfekti etuliitteillä (ja osin päätteillä)."],
 ex:[["שָׁמַר / יִשְׁמֹר","hän vartioi / hän vartioi (tulee vartioimaan)"]],
 deep:"Ne eivät ole tarkalleen aikamuotoja vaan näkökulmia. Perfekti on kuin valokuva tapahtuneesta, imperfekti kuin video, joka on vielä käynnissä. Käytännössä: perfekti = ’teki’, imperfekti = ’tekee/tulee tekemään’.",
 pre:["root"]},
{id:"perfA",ch:10,t:"Qal-perfekti: a-perfekti",pg:"93",
 sum:["Malliverbi שָׁמַר ’vartioida’: שָׁמַר hän (m), שָׁמְרָה hän (f), שָׁמַרְתָּ sinä (m), שָׁמַרְתְּ sinä (f), שָׁמַרְתִּי minä","שָׁמְרוּ he, שְׁמַרְתֶּם te (m), שְׁמַרְתֶּן te (f), שָׁמַרְנוּ me","Päätteet: -ָה, -ְתָּ, -ְתְּ, -ְתִּי, -וּ, -ְתֶּם, -ְתֶּן, -ְנוּ. Monikon 2. persoonassa ensimmäinen vokaali supistuu šewaksi."],
 ex:[["כָּתַבְתִּי","minä kirjoitin"],["שְׁמַרְתֶּם","te (m) vartioitte"]],
 deep:"Päätteissä näkyy pronominien jälki: -תָּ ~ אַתָּה ’sinä’, -תֶּם ~ אַתֶּם ’te’, -נוּ ~ אֲנַחְנוּ ’me’, -תִּי ~ ’minä’. Opettele siis pronominit, niin perfektin päätteet tulevat melkein ilmaiseksi.",
 pre:["root","pron"]},
{id:"perfEO",ch:10,t:"e- ja o-perfekti",pg:"94",
 sum:["Osa verbeistä on statiiveja eli ilmaisee tilaa. Niillä vartalovokaali on e tai o: זָקֵן ’olla vanha’ (e-perfekti), קָטֹן ’olla pieni’ (o-perfekti).","e-perfektissä e säilyy vain yks. 3. mask. -muodossa, muualla se muuttuu a:ksi: זָקַנְתִּי.","o-perfekti: קָטֹנְתִּי, קְטָנְתֶּם jne."],
 ex:[["כָּבֵד","olla raskas (e-perfekti)"]],
 deep:"Jos verbi kuvaa olotilaa (vanha, raskas, pieni, täynnä), sen vartalovokaali on usein e tai o. Päätteet ovat samat kuin a-perfektissä, vain vokaali vaihtelee.",
 pre:["perfA"]},
{id:"perfLar",ch:10,t:"Laryngaaliverbit ja erityispiirteet",pg:"95–97",
 sum:["Laryngaali ei ota ääntyvää šewaa → tilalle ḥatef: אָהֲבָה (vrt. שָׁמְרָה), אֲהַבְתֶּם, עֲמַדְתֶּם.","III-ח/ע: yks. 2. fem. שָׁמַעַתְּ, שָׁלַחַתְּ.","Assimilaatio: kun juuren viimeinen on ת tai נ, se sulautuu päätteeseen: כָּרַתִּי, נָתַתִּי, נָתַנּוּ."],
 ex:[["אָהֲבָה","hän (f) rakasti"]],

{id:"weakperf",ch:11,t:"Heikkojen verbien perfekti",pg:"100–108",

function M(id){return S.m[id]||(S.m[id]={n:0,ok:0,s:0,last:0})}
function record(topic,ok){
  if(!topic)return;const m=M(topic);const v=ok===true?1:ok===false?0:(+ok||0);m.n++;m.ok+=v;
  tick();m.s = m.n===1 ? (v>=1?0.7:v>0?0.4:0.15) : m.s*0.72+v*0.28; m.last=Date.now();
  if(S.stuck[topic] && m.s>0.8 && m.n>=4) S.stuck[topic].solved=true;
  save();
}
const conf=id=>S.m[id]?Math.min(S.m[id].n/5,1):0;

function chapterScore(n){const ts=TOPICS.filter(t=>t.ch===n);if(!ts.length)return null;let s=0;ts.forEach(t=>s+=mastery(t.id)*(0.5+0.5*conf(t.id)));return s/ts.length}

function grade(){const o=overall();if(o.seen<Math.min(8,o.total))return null;const p=o.p*100;return p<40?0:p<52?1:p<64?2:p<76?3:p<88?4:5}

 ["וְשָׂם אַבְרָהָם אֶת־יִצְחָק עַל הַמִּזְבֵּחַ וְלָקַח אֶת־הַמַּאֲכֶלֶת בְּיָדוֹ","Abraham pani Iisakin alttarille ja otti veitsen käteensä."],
 ["וּמַלְאַךְ יהוה בָּא אֵלָיו וְקָרָא","Herran enkeli tuli hänen luokseen ja huusi:"],
 ["אַל†† תִּשְׁלַח אֶת־יָדְךָ אֶל־הַנַּעַר","”Älä ojenna kättäsi poikaan.”"],
 ["עַתָּה יָדַעְתִּי כִּי יָרֵאתָ אֶת־הָאֱלֹהִים","”Nyt tiedän, että sinä pelkäät Jumalaa.”"],
 ["וְרָאָה אַבְרָהָם אַיִל וְלָקַח אֹתוֹ וְשָׂם עַל הַמִּזְבֵּחַ","Abraham näki pässin, otti sen ja asetti alttarille."],
 ["וְשָׁמַר אֱלֹהִים אֶת־יִצְחָק וְהָיְתָה זֹאת יְשׁוּעָה לְיִצְחָק","Siten Jumala varjeli Iisakia, ja se koitui pelastukseksi Iisakille."]],

{id:"rebekka",t:"Iisak ja Rebekka",g:"Qal-imperfekti, vahvat verbit",ch:12,
 v:[["אַבְרָהָם זָקֵן מְאֹד וְאֵין אִשָּׁה לְיִצְחָק בְּנוֹ","Abraham oli hyvin vanha, eikä hänen pojallaan Iisakilla ollut vaimoa."],
 ["וְאַבְרָהָם קָרָא לְעַבְדּוֹ וְאָמַר לוֹ","Abraham kutsui palvelijansa ja sanoi hänelle:"],
 ["יהוה אֱלֹהֵי הַשָּׁמַיִם יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ","”Herra, taivaan Jumala, lähettää enkelinsä sinun edelläsi."],
 ["תִּשְׁמַע* לְקוֹלִי וְתִשְׁמֹר* אֶת־דְּבָרַי","Kuuntele minua ja pidä se, mitä sanon:"],
 ["לֵךְ† אֶל־עִיר אֲבוֹתַי וְתִדְרֹשׁ* אִשָּׁה לִבְנִי יִצְחָק","mene isieni kaupunkiin ja etsi sieltä vaimo pojalleni Iisakille.”"],
 ["וְהָלַךְ הָעֶבֶד וּבָא אֶל־הָעִיר וְעָמַד עַל בְּאֵר אֲשֶׁר בָּעִיר","Palvelija meni ja saapui kaupunkiin, ja hän asettui seisomaan kaivolle, joka oli kaupungissa."],
 ["וְאָמַר הָעֶבֶד לֵאלֹהִים","Palvelija sanoi Jumalalle:"],
 ["תִּשְׁמַע* אֱלֹהִים אֶת־תְּפִלָּתִי וְתִשְׁלַח* אוֹת הַיּוֹם","”Jumala, kuule rukoukseni ja lähetä merkki tänään.”"],
 ["וְרִבְקָה יָצְאָה מִן הָעִיר וְהָלְכָה אֶל־הַבְּאֵר","Rebekka tuli ulos kaupungista ja meni kaivolle."],
 ["וְשָׁאַל הָעֶבֶד אֹתָהּ מִי אַתְּ","Palvelija kysyi häneltä: ”Kuka olet?”"],
 ["וְאָמְרָה רִבְקָה","Rebekka sanoi:"],
 ["בַּת בְּתוּאֵל אֲנִי רִבְקָה","”Olen Rebekka, Betuelin tytär.”"],
 ["הָעֶבֶד שָׁמַע זֹאת וְכָרַע לִפְנֵי יהוה","Palvelija kuuli tämän ja polvistui Herran eteen."],
 ["וְאָמַר הָעֶבֶד לֵאמֹר‡ אֱלֹהִים יִשְׁמַע תְּפִלָּה","Palvelija sanoi: ”Jumala kuulee rukouksen.”"],
 ["שָׁמְעוּ בְּתוּאֵל וְלָבָן אֶת־הַדְּבָרִים הָאֵלֶּה וְאָמְרוּ","Betuel ja Laaban kuulivat nämä sanat ja sanoivat:"],
 ["יהוה יִפְקֹד אֶת־הַדָּבָר הַזֶּה וְהָעֶבֶד יִשְׁמֹר אֶת־רִבְקָה בַּדֶּרֶךְ","”Herra järjestää tämän asian, ja palvelija varjelee Rebekkaa matkalla.”"],
 ["וְהָלְכָה רִבְקָה עִם הָעֶבֶד אֶל־אֶרֶץ כְּנָעַן","Rebekka meni palvelijan kanssa Kanaanin maahan."],
 ["וְרָאָה יִצְחָק אֶת־רִבְקָה מֵרָחוֹק וְהָלַךְ אֵלֶיהָ","Iisak näki Rebekan kaukaa ja meni häntä kohti."],
 ["וְלָקַח אֹתָהּ לְאִשָּׁה וְאָהַב אֹתָהּ","Hän otti hänet vaimokseen ja rakasti häntä."]],

{id:"jaakob",t:"Jaakobin pako",g:"Konsekutiivimuodot (ja yleisiä heikkoja verbejä)",ch:13,
 v:[["יִצְחָק זָקֵן וְעֵינָיו לֹא רָאוּ","Iisak oli tullut vanhaksi, eivätkä hänen silmänsä nähneet."],
 ["וּלְיִצְחָק שְׁנֵי בָנִים יַעֲקֹב וְעֵשָׂו","Iisakilla oli kaksi poikaa, Jaakob ja Esau."],
 ["וַיָּבֹא יַעֲקֹב אֶל־אָבִיו וַיֹּאמֶר","Jaakob tuli isänsä luo ja sanoi:"],
 ["אָנֹכִי עֵשָׂו בְּכֹרֶךָ","”Minä olen Esau, esikoisesi.”"],
 ["וַיִּשְׁמַע יִצְחָק אֶת־קוֹלוֹ וְלֹא יָדַע כִּי הָיָה יַעֲקֹב","Iisak kuuli hänen äänensä, mutta ei tiennyt, että se oli Jaakob."],
 ["וַיֹּאמֶר יִצְחָק","Iisak sanoi:"],
 ["בֹּא† נָא אֵלַי","”Tule nyt luokseni.”"],
 ["וַיָּבֹא יַעֲקֹב אֵלָיו וַיֹּאמֶר לוֹ יִצְחָק","Jaakob tuli hänen luokseen, ja Iisak sanoi hänelle:"],
 ["בָּרוּךְ‡ אַתָּה לִפְנֵי יהוה","”Sinä olet siunattu Herran edessä."],
 ["וְיִשְׁמֹר אֶת־זַרְעֶךָ","Jumala varjelkoon siementäsi.”"],
 ["וַיִּשְׁמַע עֵשָׂו אֶת־הַדְּבָרִים הָאֵלֶּה וַיִּקְרָא בְּקוֹל גָּדוֹל וַיֹּאמֶר לְאָבִיו","Esau kuuli nämä sanat, huusi suurella äänellä ja sanoi isälleen:"],
 ["בָּרַכְתָּ אֹתוֹ וְלֹא אֹתִי","”Olet siunannut hänet etkä minua!”"],
 ["וְעֵשָׂו שָׂנֵא אֶת־יַעֲקֹב","Esau vihasi Jaakobia."],
 ["וְרִבְקָה שָׁמְעָה זֹאת וַתֹּאמֶר לְיַעֲקֹב","Rebekka kuuli tämän ja sanoi Jaakobille:"],
 ["בְּרַח†† מִזֶּה וְהָלַכְתָּ אֶל־חָרָן","”Pakene täältä ja mene Harraniin.”"],
 ["וְיַעֲקֹב יָרֵא וַיִּבְרַח אֶל־חָרָן","Jaakob pelkäsi ja pakeni Harraniin."],
 ["וּבַדֶּרֶךְ שָׁכַב יַעֲקֹב וַיַּחֲלֹם חֲלוֹם","Matkalla Jaakob kävi makuulle ja näki unen."],
 ["וְיַעֲקֹב רָאָה סֻלָּם וּמַלְאָכִים עָלוּ וְיָרְדוּ עָלָיו","Jaakob näki tikkaat, ja enkelit nousivat ja laskeutuivat niitä pitkin."],
 ["וַיֹּאמֶר יהוה","Herra sanoi:"],
 ["אֲנִי יהוה אֱלֹהֵי אַבְרָהָם וְשָׁמַרְתִּי אֹתְךָ בְּכָל־אֲשֶׁר תֵּלֵךְ","”Minä olen Herra, Abrahamin Jumala, ja minä varjelen sinua kaikkialla, mihin menet.”"],
 ["וְיַעֲקֹב לָקַח אֶבֶן וְשָׂם אֹתָהּ מַצֵּבָה","Jaakob otti kiven ja pani sen pystyyn patsaaksi."],
 ["וַיֹּאמֶר זֶה בֵּית אֱלֹהִים","Hän sanoi: ”Tämä on Jumalan huone.”"],
 ["וַיָּבֹא יַעֲקֹב חָרָנָה וַיֵּשֶׁב בְּחָרָן","Jaakob saapui Harraniin ja asui Harranissa."],
 ["וַיַּעֲבֹד יַעֲקֹב אֶת־לָבָן שָׁנִים רַבּוֹת","Jaakob palveli Laabania monta vuotta."],
 ["וַיִּקַּח יַעֲקֹב שְׁתֵּי נָשִׁים אֶת־לֵאָה וְאֶת־רָחֵל","Jaakob otti kaksi vaimoa, Leean ja Raakelin."],
 ["וְהַנָּשִׁים יָלְדוּ לוֹ בָּנִים רַבִּים וְיַעֲקֹב גָּדַל מְאֹד","Vaimot synnyttivät hänelle monta poikaa, ja Jaakob tuli hyvin mahtavaksi."]],

{id:"joosef",t:"Joosefin myyminen",g:"Heikot qal-imperfektit ja heikkojen verbien konsekutiiviset muodot",ch:14,
 v:[["וְהָיוּ לְיַעֲקֹב שְׁנֵים עָשָׂר בָּנִים","Jaakobilla oli kaksitoista poikaa."],
 ["וַיֶּאֱהַב אֶת־יוֹסֵף מִכָּל־בָּנָיו","Hän rakasti Joosefia enemmän kuin muita poikiaan."],
 ["וַיַּעַשׂ יַעֲקֹב לוֹ כְּתֹנֶת יָפָה","Jaakob teki hänelle kauniin kaavun."],

groups:{p:["Kirjaimet jakautuvat ryhmiin, joilla on yhteisiä sääntöjä. Kun tunnet ryhmät, ymmärrät, miksi sanat käyttäytyvät oudosti.","<b>Laryngaalit</b> eli kurkkuäänteet א ה ח ע (ja usein ר) eivät voi kahdentua, ja ne suosivat a-vokaalia. Siksi esimerkiksi artikkeli ennen niitä muuttuu.","<b>Begadkefat</b> ב ג ד כ פ ת: näillä on kaksi ääntämystä. Pisteellä (dageš lene) ne ovat klusiileja (b, k, p), ilman pistettä frikatiiveja (v, ḵ, f)."],
 tbl:[["Ryhmä","Kirjaimet","Muistisääntö"],[["laryngaalit","א ה ח ע (ר)","eivät kahdennu, suosivat a:ta"],["begadkefat","ב ג ד כ פ ת","piste = kova ääni"],["emfaattiset","ט צ ק","”painokkaat” konsonantit"],["sibilantit","ז ס צ שׂ שׁ","sihisijät"]]],
 ex:[["בַּיִת / וּבַיִת","bajit / ūvajit: ב on kova sanan alussa, pehmeä vokaalin jälkeen"]],err:"Muista: dageš ei näy kurkkuäänteissä. Jos sääntö vaatisi kahdennusta, edeltävä vokaali yleensä pitenee."},
matres:{p:["Koska kirjoitus oli alun perin pelkkiä konsonantteja, pitkiä vokaaleja merkittiin joskus konsonanteilla. Näitä kutsutaan nimellä <b>matres lectionis</b> (”lukemisen äidit”).","<b>ו</b> merkitsee ō- tai ū-vokaalia (וֹ = ō, וּ = ū). <b>י</b> merkitsee ī-, ē- tai ɛ-vokaalia. <b>ה</b> sanan lopussa merkitsee yleensä ā-, ɛ- tai ō-vokaalia.","Mater ei ole oma konsonanttinsa: sitä ei äännetä erikseen. Kirjoitustapa voi olla täysi (plene) tai vajaa: קוֹל tai קֹל, molemmat qōl."],
 ex:[["סוּס","sūs ’hevonen’: ו merkitsee ū:ta"],["תּוֹרָה","tōrā ’laki’: ו = ō, lopun ה = ā"]],err:"Kun ו:ssa on oma vokaali (esim. וְ), se on konsonantti eikä mater."},
vowels:{p:["Vokaalit kirjoitetaan pisteinä ja viivoina konsonantin <b>alle</b>, <b>päälle</b> tai viereen. Lue aina ensin konsonantti, sitten sen vokaali: בַּ = ba.","Kirjan järjestelmässä vokaalit jaetaan pitkiin ja lyhyisiin. Muistisääntö: viivat ovat a-ääniä, pisteparit e-ääniä, yksi piste alla on i, piste ylhäällä on o."],
 tbl:[["Merkki","Nimi","Ääni"],[["בַ","pataḥ","a"],["בָ","qāmeṣ","ā"],["בֶ","segol","ɛ"],["בֵ","ṣērē","ē"],["בִ","ḥīreq","i"],["בִי","ḥīreq + jod","ī"],["בֹ","ḥōlem","ō"],["בוֹ","ḥōlem + vav","ō"],["בֻ","qibbūṣ","u"],["בוּ","šūreq","ū"],["בְ","šəwā","ə / –"]]],
 ex:[["דָּבָר","dā-vār ’sana, asia’"],["אֱלֹהִים","ʾɛ̆lō-hīm ’Jumala’"]],err:"Qāmeṣ (ָ) ja pataḥ (ַ) näyttävät samalta pikakatsella. Qāmeṣissa on pieni pystyviiva alla."},
shewa:{p:["Šəwā (ְ) on kaksi pistettä päällekkäin. Se merkitsee joko <b>hyvin lyhyttä vokaalia</b> (ə) tai <b>vokaalin puuttumista</b>.","<b>Ääntyvä šəwā</b> (š. mobile): sanan alussa, kahdennetun kirjaimen alla ja kahden šəwān jälkimmäisenä. <b>Äänetön šəwā</b> (š. quiescens): sulkee tavun, esim. sanan keskellä tavun lopussa.","Kurkkuäänteet eivät siedä pelkkää šəwāa, joten niissä on <b>supistunut vokaali</b>: ֲ (ă), ֱ (ɛ̆) tai ֳ (ŏ)."],
 ex:[["בְּרִית","bərīt ’liitto’: alun šəwā ääntyy"],["מִשְׁפָּט","miš-pāṭ ’tuomio’: ensimmäinen šəwā sulkee tavun"]],err:"Sanan lopussa šəwā on aina äänetön (esim. ךְ)."},
special:{p:["<b>Pataḥ furtivum</b>: sanan lopun ח, ע tai ה (mappiqilla) saa eteensä ”livahtaneen” a-äänteen, joka äännetään ennen konsonanttia: רוּחַ = rūaḥ.","<b>Qāmeṣ ḥāṭūf</b> näyttää qāmeṣilta, mutta äännetään lyhyenä o:na suljetussa painottomassa tavussa: כָּל־ = kol."],ex:[["מִזְבֵּחַ","mizbēaḥ ’alttari’"],["כָּל־הָאָרֶץ","kol hāʾārɛṣ ’koko maa’"]],err:"Pataḥ furtivum ei muodosta omaa tavua."},
dagesh:{p:["Dageš on piste kirjaimen sisällä. Sillä on kaksi tehtävää.","<b>Dageš lene</b> vain begadkefat-kirjaimissa tavun alussa, kun edellä ei ole vokaalia: ääni on kova (בּ = b).","<b>Dageš forte</b> kahdentaa konsonantin: הַמֶּלֶךְ = ham-mɛlɛḵ. Se tulee vokaalin jälkeen, ja se voi olla missä tahansa kirjaimessa paitsi kurkkuäänteissä ja ר:ssä."],
 ex:[["שַׁבָּת","šabbāt: dageš forte, koska edellä on vokaali"],["מִשְׁפָּט","mišpāṭ: dageš lene, koska edellä on äänetön šəwā"]],err:"Vokaalikirjain וּ (šūreq) ei ole dageš, vaikka piste on samassa paikassa."},
marks:{p:["<b>Maqqef</b> (־) on yhdysviiva, joka sitoo sanat yhdeksi painoyksiköksi: אֶת־הָאָרֶץ.","<b>Mappiq</b> on piste lopun ה:ssä, joka tekee siitä konsonantin: לָהּ = lāh ’hänelle (f)’.","<b>Meteg</b> on pieni pystyviiva vokaalin vieressä: sivupaino."],ex:[["לָהּ","lāh: mappiq, ה äännetään"]],err:"Ilman mappiqia lopun ה on vokaalikirjain."},
syllable:{p:["Jokainen tavu alkaa <b>konsonantilla</b>, ja jokaisessa on yksi täysvokaali. Avotavu päättyy vokaaliin (CV), umpitavu konsonanttiin (CVC).","Paino on useimmiten <b>viimeisellä tavulla</b>, joskus toiseksi viimeisellä (segolaatit: מֶלֶךְ = MɛLɛḵ)."],ex:[["דָּ·בָר","dā-vār: avotavu + umpitavu"],["מִשְׁ·פָּט","miš-pāṭ: kaksi umpitavua"]],err:"Hepreassa tavu ei ala vokaalilla: alef tai he kantaa vokaalia."},
qere:{p:["<b>Ketiv</b> on se, mitä tekstiin on kirjoitettu, ja <b>qere</b> se, mitä luetaan. Masoreetit eivät muuttaneet pyhää konsonanttitekstiä, vaan merkitsivät luettavan muodon vokaaleilla ja marginaaliin.","Tärkein: יהוה luetaan (ʾădōnāj) ’Herra’ tai joskus (ʾɛ̆lōhīm)."],ex:[["יהוה","luetaan ʾădōnāj ’Herra’"]],err:"Älä yritä ääntää יהוה:n vokaaleja sellaisinaan."},
semitic:{p:["Heprea kuuluu <b>seemiläisiin kieliin</b>, kuten aramea, arabia ja akkadi. Yhteistä on juurijärjestelmä: useimmat sanat rakentuvat kolmen konsonantin juuresta, ja vokaalit ja liitteet muuttavat merkitystä.","Juuri כתב ’kirjoittaa’: כָּתַב ’hän kirjoitti’, כֹּתֵב ’kirjoittava’, מִכְתָּב ’kirje’."],err:"Tämä luku on taustatietoa, ei tenttikysymys."},
gender:{p:["Substantiiveilla on <b>suku</b> (maskuliini/feminiini) ja <b>luku</b> (yksikkö, monikko, joskus duaali).","Feminiini päättyy usein ־ָה tai ־ֶת/־ת. Maskuliinin monikkopääte on <b>־ִים</b>, feminiinin <b>־וֹת</b>. Duaali ־ַיִם esiintyy pareissa (kädet, silmät)."],
 tbl:[["","Maskuliini","Feminiini"],[["yksikkö","סוּס","סוּסָה"],["monikko","סוּסִים","סוּסוֹת"],["duaali","יוֹמַיִם (kaksi päivää)","יָדַיִם (kädet)"]]],ex:[["אָבוֹת","ʾāvōt ’isät’: maskuliini, jolla on ־וֹת-monikko"]],err:"Pääte ei aina kerro sukua: אָב ’isä’ on maskuliini, mutta monikko on אָבוֹת."},
article:{p:["Määräinen artikkeli on <b>הַ + kahdennus</b> sanan ensimmäiseen kirjaimeen: מֶלֶךְ → הַמֶּלֶךְ ’kuningas’.","Kurkkuäänne ei kahdennu, joten vokaali muuttuu: ennen א, ר, ע yleensä <b>הָ</b> (הָאִישׁ, הָרֹאשׁ, הָעִיר); ennen ה ja ח yleensä <b>הַ</b> ilman kahdennusta (הַהֵיכָל, הַחֹשֶׁךְ). Ennen painotonta הָ tai עָ: הֶ.","Epämääräistä artikkelia ei ole: מֶלֶךְ = ’kuningas, eräs kuningas’."],
 tbl:[["Sanan alku","Artikkeli","Esimerkki"],[["tavallinen","הַ + dageš","הַמֶּלֶךְ"],["א ר ע","הָ","הָאִישׁ"],["ה ח","הַ (ei dageš)","הַחֹשֶׁךְ"],["painoton הָ/עָ","הֶ","הֶהָרִים"]]],err:"Älä laita dagešia kurkkuäänteeseen."},
attr:{p:["Adjektiivi tulee <b>substantiivin jälkeen</b> ja mukautuu siihen suvussa, luvussa ja määräisyydessä.","Jos substantiivissa on artikkeli, myös adjektiivissa on: הַמֶּלֶךְ הַטּוֹב ’hyvä kuningas’. Ilman artikkelia: מֶלֶךְ טוֹב ’hyvä kuningas (eräs)’."],ex:[["הָעִיר הַגְּדוֹלָה","hāʿīr haggədōlā ’suuri kaupunki’ (feminiini)"],["אֲנָשִׁים טוֹבִים","ʾănāšīm ṭōvīm ’hyvät miehet’"]],err:"Jos adjektiivissa ei ole artikkelia mutta substantiivissa on, kyse on nominaalilauseesta: הַמֶּלֶךְ טוֹב = kuningas on hyvä."},
nominal:{p:["Nominaalilauseessa ei ole verbiä. Suomeen lisätään ’on’: הַמֶּלֶךְ טוֹב ’kuningas <b>on</b> hyvä’.","Predikaatti voi olla adjektiivi, substantiivi, prepositiolauseke tai pronomini. Predikaattiadjektiivilla <b>ei ole artikkelia</b>, ja se tulee usein ensin: טוֹב הַמֶּלֶךְ.","Aikamuoto päätellään yhteydestä: lause voi tarkoittaa myös ’oli’."],ex:[["יהוה אֱלֹהֵינוּ","ʾădōnāj ʾɛ̆lōhēnū ’Herra on meidän Jumalamme’"],["הָאִישׁ בַּבַּיִת","’mies on talossa’"]],err:"Vertaa: הַמֶּלֶךְ הַטּוֹב = hyvä kuningas (fraasi), הַמֶּלֶךְ טוֹב = kuningas on hyvä (lause)."},
waw:{p:["Ja-sana on <b>וְ</b>, ja se kirjoitetaan kiinni seuraavaan sanaan. Se merkitsee ’ja’, ’mutta’, ’sitten’ yhteydestä riippuen.","Vokaali vaihtelee: tavallisesti וְ; ennen huulikonsonantteja ב מ פ ja ennen šəwāa <b>וּ</b> (וּמֶלֶךְ, וּדְבַר); ennen יְ → <b>וִי</b> (וִיהוּדָה); ennen supistunutta vokaalia sama vokaali (וַאֲנִי)."],
 tbl:[["Ehto","Muoto","Esimerkki"],[["tavallinen","וְ","וְהָאִישׁ"],["ב מ פ tai šəwā","וּ","וּבַיִת, וּשְׁמוּאֵל"],["יְ","וִי","וִיהוּדָה"],["ֲ ֱ ֳ","וַ וֶ וָ","וַאֲנִי"]]],err:"Kertomuksen וַ + kahdennus (וַיִּ) on eri asia: se on konsekutiivinen imperfekti (luku 13)."},
preps:{p:["Kolme prepositiota kirjoitetaan kiinni sanaan: <b>בְּ</b> ’-ssa, kanssa’, <b>לְ</b> ’-lle, varten’ ja <b>כְּ</b> ’kuin’.","Jos sanassa on artikkeli, <b>ה katoaa</b> ja prepositio saa artikkelin vokaalin (ja kahdennus jää): לְ + הַמֶּלֶךְ → לַמֶּלֶךְ; בְּ + הָעִיר → בָּעִיר.","Ennen šəwāa prepositio saa i-vokaalin: לִשְׁמוּאֵל."],tbl:[["Ilman artikkelia","Artikkelin kanssa"],[["בְּבַיִת ’talossa’","בַּבַּיִת ’talossa (määr.)’"],["לְמֶלֶךְ","לַמֶּלֶךְ"],["כְּאִישׁ","כָּאִישׁ"]]],err:"בְּהַבַּיִת on väärin: artikkelin ה ei jää näkyviin prepositioiden jälkeen."},
prep2:{p:["Erillisiä prepositioita: אֶל ’luo, -hin’, עַל ’päällä, -sta’, עִם ’kanssa’, אֵת ’kanssa’, תַּחַת ’alla’, לִפְנֵי ’edessä’, אַחֲרֵי ’jälkeen’.","<b>מִן</b> ’-sta, kuin’ liittyy usein sanaan: נ assimiloituu ja seuraava kirjain kahdentuu: מִן + בַּיִת → מִבַּיִת. Ennen kurkkuäännettä vokaali pitenee: מֵעִיר."],ex:[["מֵהָעִיר","mēhāʿīr ’kaupungista’"]],err:"Objektin merkki אֶת ja prepositio אֵת ’kanssa’ näyttävät samalta: ratkaise yhteydestä."},
compar:{p:["Hepreassa ei ole komparatiivipäätettä. Vertailu tehdään prepositiolla <b>מִן</b>: טוֹב מִן ’parempi kuin’.","Superlatiivi ilmaistaan artikkelilla tai rakenteella: הַקָּטֹן ’pienin’."],ex:[["גָּדוֹל מִמֶּנּוּ","gādōl mimmɛnnū ’suurempi kuin hän’"]],err:"Muista: adjektiivi pysyy perusmuodossa, vain מִן tekee vertailun."},
verbal:{p:["Verbaalilauseen tavallinen järjestys on <b>verbi – subjekti – objekti</b>, mutta subjekti voi olla myös ensin painotuksen vuoksi.","Määräisen objektin eteen tulee <b>אֶת</b> (tai אֶת־), jota ei käännetä: רָאָה אֶת־הַמֶּלֶךְ ’hän näki kuninkaan’."],ex:[["וְאַבְרָם שָׁמַע אֶת־קוֹל יהוה","’Abram kuuli Herran äänen’ (subjekti ensin)"]],err:"אֶת ei ole prepositio objektin edessä, vaan pelkkä merkki."},
commonverbs:{p:["Jo ennen verbioppia kannattaa tunnistaa yleisimmät verbit 3. persoonan perfektissä: אָמַר ’sanoi’, הָלַךְ ’meni’, בָּא ’tuli’, רָאָה ’näki’, שָׁמַע ’kuuli’, עָשָׂה ’teki’, נָתַן ’antoi’, לָקַח ’otti’, הָיָה ’oli’.","Nämä toistuvat Raamatun kertomuksissa ja Patriarkkojen tarinassa jatkuvasti."],err:"Opettele juuri ja perusmerkitys yhdessä."},
pron:{p:["Itsenäiset persoonapronominit toimivat subjektina, erityisesti nominaalilauseissa: אֲנִי מֶלֶךְ ’minä olen kuningas’."],tbl:[["Persoona","Pronomini"],[["minä","אֲנִי / אָנֹכִי"],["sinä (m)","אַתָּה"],["sinä (f)","אַתְּ"],["hän (m)","הוּא"],["hän (f)","הִיא"],["me","אֲנַחְנוּ"],["te (m)","אַתֶּם"],["te (f)","אַתֶּן"],["he (m)","הֵם / הֵמָּה"],["he (f)","הֵן / הֵנָּה"]]],err:"Verbin persoona näkyy jo verbissä, joten pronomini verbin kanssa on painotus."},
demo:{p:["Demonstratiivipronominit: זֶה ’tämä’ (m), זֹאת ’tämä’ (f), אֵלֶּה ’nämä’; הוּא/הִיא/הֵם ’se, ne’ (kaukainen).","Attribuuttina ne tulevat substantiivin jälkeen artikkelin kanssa: הָאִישׁ הַזֶּה ’tämä mies’. Predikaattina ilman artikkelia ensin: זֶה הָאִישׁ ’tämä on mies’."],ex:[["הָאָרֶץ הַזֹּאת","’tämä maa’"]],err:"זֶה הַבַּיִת = tämä on talo; הַבַּיִת הַזֶּה = tämä talo."},
quest:{p:["Kysymyspartikkeli <b>הֲ</b> liitetään lauseen ensimmäiseen sanaan: הֲטוֹב ’onko hyvä?’. Ennen kurkkuääntä tai šəwāa: הַ.","Kysymyssanat: מִי ’kuka’, מָה ’mitä’, אֵי/אַיֵּה ’missä’, לָמָּה ’miksi’, מֵאַיִן ’mistä’."],ex:[["מִי אַתְּ","’kuka sinä (f) olet?’"]],err:"Kysymys-הֲ ja artikkeli הַ: artikkelin jälkeen on kahdennus, kysymyspartikkelin jälkeen ei."},
copula:{p:["Olemassaoloa ilmaisee <b>יֵשׁ</b> ’on olemassa’ ja puuttumista <b>אֵין</b> ’ei ole’: אֵין אִשָּׁה לְיִצְחָק ’Iisakilla ei ole vaimoa’. Omistus ilmaistaan rakenteella יֵשׁ לְ / אֵין לְ."],ex:[["יֵשׁ לִי כֶּסֶף","’minulla on hopeaa’"]],err:"Hepreassa ei ole verbiä ’omistaa’."},
status:{p:["<b>Status constructus</b> (genetiivirakenne) yhdistää kaksi substantiivia: ensimmäinen on ”omistettu”, toinen ”omistaja”: דְּבַר יהוה ’Herran sana’.","Ensimmäinen sana on constructus-muodossa (usein lyhentynyt), eikä sillä ole artikkelia. Määräisyyden ratkaisee jälkimmäinen sana: בֵּית הַמֶּלֶךְ ’kuninkaan talo’.","Ketjuja voi olla useampi: בֵּית אֲבִי הַמֶּלֶךְ."],ex:[["סוּס הַמֶּלֶךְ","’kuninkaan hevonen’"],["אֶרֶץ כְּנַעַן","’Kanaanin maa’"]],err:"הַבֵּית הַמֶּלֶךְ on väärin: constructus-sanassa ei ole artikkelia."},
cstrforms:{p:["Constructus-muodot lyhenevät, koska paino siirtyy seuraavaan sanaan.","Tärkeimmät: maskuliinin monikko ־ִים → <b>־ֵי</b> (סוּסִים → סוּסֵי); feminiinin ־ָה → <b>־ַת</b> (תּוֹרָה → תּוֹרַת); דָּבָר → דְּבַר; בַּיִת → בֵּית."],tbl:[["Absoluuttinen","Constructus"],[["סוּסִים","סוּסֵי"],["תּוֹרָה","תּוֹרַת"],["דָּבָר","דְּבַר"],["בַּיִת","בֵּית"],["אָב","אֲבִי"]]],err:"Pääte ־ֵי voi olla myös monikon suffiksi ’minun’ (־ַי): katso vokaali."},
circum:{p:["Omistusta voi ilmaista myös kiertoilmauksella <b>אֲשֶׁר לְ</b> ’joka kuuluu’: הַכֶּרֶם אֲשֶׁר לְנָבוֹת ’Nabotin viinitarha’."],err:"Tätä käytetään, kun constructus olisi kömpelö."},
suffn:{p:["Omistusta ilmaistaan useimmiten <b>persoonasuffiksilla</b>: סוּס ’hevonen’ → סוּסִי ’minun hevoseni’.","Yksikölliseen ja monikolliseen sanaan liitetään hieman eri suffiksit: monikollisessa on י-kirjain (סוּסַי ’minun hevoseni’ (mon.))."],tbl:[["","Yks. nomini","Mon. nomini"],[["minun","סוּסִי","סוּסַי"],["sinun (m)","סוּסְךָ","סוּסֶיךָ"],["sinun (f)","סוּסֵךְ","סוּסַיִךְ"],["hänen (m)","סוּסוֹ","סוּסָיו"],["hänen (f)","סוּסָהּ","סוּסֶיהָ"],["meidän","סוּסֵנוּ","סוּסֵינוּ"],["teidän (m)","סוּסְכֶם","סוּסֵיכֶם"],["heidän (m)","סוּסָם","סוּסֵיהֶם"]]],err:"Suffiksi liitetään constructus-muotoon: דָּבָר → דְּבָרוֹ."},
suffp:{p:["Prepositiot ottavat samat suffiksit: לִי ’minulle’, בּוֹ ’hänessä’, עִמִּי ’minun kanssani’.","Objektin merkki אֶת saa suffiksin muodossa אֹת־: אֹתִי ’minut’, אֹתוֹ ’hänet’, אֹתָם ’heidät’."],tbl:[["","לְ","אֶת (objekti)"],[["minä","לִי","אֹתִי"],["sinä (m)","לְךָ","אֹתְךָ"],["hän (m)","לוֹ","אֹתוֹ"],["hän (f)","לָהּ","אֹתָהּ"],["me","לָנוּ","אֹתָנוּ"],["he (m)","לָהֶם","אֹתָם"]]],err:"עַל, אֶל ja אַחֲרֵי käyttävät monikollisen nominin suffikseja: עָלָיו, אֵלֶיהָ."},
root:{p:["Verbit rakentuvat yleensä <b>kolmen konsonantin juuresta</b>. Kun luet verbiä, etsi ensin juuri ja sitten liitteet.","Juuri merkitään sanakirjassa 3. persoonan maskuliinin perfektillä: שָׁמַר ’hän varjeli’ = ’varjella’.","Kieliopissa juuren paikkoja merkitään: I = 1. konsonantti, II = 2., III = 3. Esim. I-נ-verbi נתן."],ex:[["וַיִּשְׁמְרוּ","juuri שמר: וַ (kons.) + יִ (etuliite) + שמר + וּ (pääte)"]],err:"Heikoissa verbeissä yksi juurikonsonantti voi kadota (נתן → יִתֵּן)."},
aspect:{p:["Heprean verbillä on kaksi päämuotoa: <b>perfekti</b> (päätteet) ja <b>imperfekti</b> (etuliitteet). Ne kuvaavat ensisijaisesti tekemisen tapaa: perfekti valmista, imperfekti keskeneräistä tai tulevaa.","Kertomuksissa menneisyyttä kuvataan usein konsekutiivisella imperfektillä (וַיִּקְטֹל), luku 13."],err:"Älä käännä perfektiä aina imperfektiksi tai päinvastoin: yhteys ratkaisee."},
perfA:{p:["Qal-perfekti muodostetaan <b>päätteillä</b>, jotka kertovat persoonan. Perusmuoto (3. yks. m.) on samalla sanakirjamuoto: כָּתַב.","Opettele päätteet ulkoa: ne pysyvät samoina kaikissa verbeissä."],tbl:[["Persoona","Muoto","Pääte"],[["hän (m)","כָּתַב","–"],["hän (f)","כָּתְבָה","־ָה"],["sinä (m)","כָּתַבְתָּ","־תָּ"],["sinä (f)","כָּתַבְתְּ","־תְּ"],["minä","כָּתַבְתִּי","־תִּי"],["he","כָּתְבוּ","־וּ"],["te (m)","כְּתַבְתֶּם","־תֶּם"],["te (f)","כְּתַבְתֶּן","־תֶּן"],["me","כָּתַבְנוּ","־נוּ"]]],err:"־וּ (he) ja ־נוּ (me): katso onko edellä נ."},
perfEO:{p:["Statiivi- eli tilaverbeillä on perfektissä e- tai o-vokaali: כָּבֵד ’olla raskas’, זָקֵן ’olla vanha’, קָטֹן ’olla pieni’.","Ne kuvaavat tilaa, joten suomennos on usein ’on/oli’: זָקֵן אַבְרָהָם ’Abraham oli vanha’."],err:"Päätteet ovat samat kuin tavallisilla verbeillä."},
perfLar:{p:["Kun juuressa on kurkkuäänne, vokaalit muuttuvat: šəwān tilalle tulee supistunut vokaali, ja kurkkuäänne suosii a:ta.","Esim. עמד: עָמְדוּ; שׁלח: שָׁלַחְתְּ (pataḥ). Päätteet pysyvät silti tunnistettavina."],err:"Tunnista päätteet ensin, sitten juuri."},
weakperf:{p:["Heikoissa verbeissä yksi juurikonsonantti on ”heikko” ja voi muuttua tai kadota.","<b>II-ו/י</b> (ontot verbit): קָם ’nousi’, שָׂם ’asetti’, בָּא ’tuli’. <b>III-ה</b>: רָאָה ’näki’, mutta 3fs רָאֲתָה ja 1cs רָאִיתִי (ה → י). <b>I-נ</b> on perfektissä säännöllinen: נָתַן, mutta נָתַתִּי (נ assimiloituu)."],tbl:[["Tyyppi","3ms","1cs"],[["vahva","שָׁמַר","שָׁמַרְתִּי"],["II-ו","קָם","קַמְתִּי"],["III-ה","רָאָה","רָאִיתִי"],["נתן","נָתַן","נָתַתִּי"]]],err:"Kaksikirjaiminen muoto kuten בָּא tai שָׂם on yleensä ontto verbi: etsi kolmas kirjain (בוא, שים)."},
impf:{p:["Qal-imperfekti muodostetaan <b>etuliitteillä</b> (ja osin päätteillä). Etuliite kertoo persoonan: א minä, ת sinä/hän (f), י hän (m), נ me.","Vahvan verbin teemavokaali on yleensä ō: יִכְתֹּב."],tbl:[["Persoona","Muoto"],[["hän (m)","יִכְתֹּב"],["hän (f) / sinä (m)","תִּכְתֹּב"],["sinä (f)","תִּכְתְּבִי"],["minä","אֶכְתֹּב"],["he (m)","יִכְתְּבוּ"],["he/te (f)","תִּכְתֹּבְנָה"],["te (m)","תִּכְתְּבוּ"],["me","נִכְתֹּב"]]],err:"תִּכְתֹּב voi olla ’sinä (m)’ tai ’hän (f)’: yhteys ratkaisee."},
impfA:{p:["Osalla verbeistä teemavokaali on a: erityisesti kun III-juurikonsonantti on kurkkuäänne tai kyse on tilaverbistä: יִשְׁמַע ’hän kuulee’, יִשְׁלַח ’hän lähettää’, יִכְבַּד."],ex:[["יִשְׁמַע","’hän kuulee’: a, koska lopussa ע"]],err:"Etuliitteet ovat samat kuin ō-imperfektissä."},
wayyiqtol:{p:["Kertomuksissa menneisyyttä kuvataan <b>konsekutiivisella imperfektillä</b>: וַ + kahdennus + imperfekti: וַיִּשְׁמַע ’ja hän kuuli’.","Muoto ketjuttaa tapahtumia: וַיָּבֹא… וַיֹּאמֶר ’ja hän tuli… ja sanoi’. Käännä menneeksi aikamuodoksi.","1. persoonassa א ei kahdennu: וָאֶשְׁמַע ’ja minä kuulin’. Monesti muoto lyhenee: יִרְאֶה → וַיַּרְא."],ex:[["וַיֹּאמֶר","’ja hän sanoi’ (אמר)"],["וַיֵּלֶךְ","’ja hän meni’ (הלך)"]],err:"וְ + imperfekti ilman kahdennusta ei ole konsekutiivi."},
weqatal:{p:["<b>Konsekutiivinen perfekti</b> on וְ + perfekti, ja se kuvaa tulevaa tai toistuvaa: וְשָׁמַרְתִּי ’ja minä varjelen’.","Se jatkaa usein imperfektiä tai käskyä: לֵךְ… וְהָלַכְתָּ ’mene… ja mene’."],err:"Muoto näyttää perfektiltä, mutta merkitys on tuleva."},
weakimpf:{p:["Heikkojen verbien imperfektit ovat tenttien yleisimpiä sudenkuoppia.","<b>I-י</b>: יֵשֵׁב, יֵדַע, יֵצֵא (י katoaa, etuliitteessä ē). <b>I-נ</b>: יִתֵּן, יִפֹּל (נ assimiloituu = kahdennus). <b>II-ו</b>: יָקוּם, יָשִׂים, יָבוֹא. <b>III-ה</b>: יִרְאֶה, יַעֲשֶׂה, lyhyesti וַיַּרְא, וַיַּעַשׂ. <b>הלך</b> käyttäytyy kuin I-י (יֵלֵךְ), <b>לקח</b> kuin I-נ (יִקַּח)."],tbl:[["Juuri","Impf.","Kons. impf."],[["ישב","יֵשֵׁב","וַיֵּשֶׁב"],["נתן","יִתֵּן","וַיִּתֵּן"],["קום","יָקוּם","וַיָּקָם"],["ראה","יִרְאֶה","וַיַּרְא"],["הלך","יֵלֵךְ","וַיֵּלֶךְ"],["לקח","יִקַּח","וַיִּקַּח"],["בוא","יָבוֹא","וַיָּבֹא"]]],err:"Jos näet vain kaksi konsonanttia ja kahdennuksen, mieti I-נ tai לקח."},
objsuf:{p:["Verbiin voi liittää <b>objektisuffiksin</b>: שְׁלָחַנִי ’hän lähetti minut’, פְּתָרוֹ ’hän selitti sen’.","Suffiksit muistuttavat nominien suffikseja: ־נִי minut, ־ךָ sinut, ־וֹ/־הוּ hänet, ־הָ hänet (f), ־נוּ meidät, ־ם heidät. Vokaalit lyhenevät, kun suffiksi lisätään: שָׁמַר → שְׁמָרוֹ."],ex:[["רָאָם","’hän näki heidät’ (רָאָה + ם)"],["וַיִּשְׁאָלֵם","’ja hän kysyi heiltä’"]],err:"Erota objektisuffiksi persoonapäätteestä: ־נוּ voi olla ’me’ (perf.) tai ’meidät’ (suffiksi)."}};
Object.assign(LESSONS,{
imper:{p:["<b>Imperatiivi</b> eli käskymuoto syntyy imperfektistä, kun etuliite jätetään pois: תִּשְׁמֹר → <b>שְׁמֹר</b> ’varjele!’. Naiselle שִׁמְרִי, monelle שִׁמְרוּ.","<b>Jussiivi</b> on 3. persoonan toive (’varjelkoon’) ja <b>kohortatiivi</b> 1. persoonan kehotus päätteellä ־ָה: אֶשְׁמְרָה ’varjelkaan’.","Kielto: <b>אַל</b> + jussiivi (”älä nyt”), <b>לֹא</b> + imperfekti (ehdoton kielto, esim. käskyissä לֹא תִגְנֹב)."],tbl:[["Juuri","Imperatiivi"],[["שמר","שְׁמֹר"],["הלך","לֵךְ"],["לקח","קַח"],["נתן","תֵּן"],["בוא","בֹּא"],["קום","קוּם"]]],err:"Heikoissa verbeissä ensimmäinen kirjain putoaa usein: לֵךְ, קַח, תֵּן."},
infin:{p:["<b>Infinitiivi constructus</b> on kuin imperatiivi: שְׁמֹר. Se esiintyy usein prepositioiden kanssa: לִשְׁמֹר ’varjellakseen’, בִּשְׁמֹר ’varjellessa’, ja לֵאמֹר ’sanoen’ johdantona repliikille.","<b>Infinitiivi absolutus</b> שָׁמוֹר vahvistaa finiittiverbiä: שָׁמוֹר תִּשְׁמְרוּ ’teidän tulee tarkoin noudattaa’."],ex:[["לֵאמֹר","’sanoen’: käännetään kaksoispisteeksi"]],err:"לִ + infinitiivi kuvaa usein tarkoitusta: ’jotta’."},
partic:{p:["Qal-partisiippi kuvaa jatkuvaa tekemistä tai tekijää: <b>שֹׁמֵר</b> ’varjeleva, vartija’. Se taipuu kuin adjektiivi: שֹׁמֶרֶת (f), שֹׁמְרִים, שֹׁמְרוֹת.","Passiivin partisiippi: <b>שָׁמוּר</b> ’varjeltu’, בָּרוּךְ ’siunattu’."],tbl:[["","Aktiivi","Passiivi"],[["m yks.","שֹׁמֵר","שָׁמוּר"],["f yks.","שֹׁמֶרֶת","שְׁמוּרָה"],["m mon.","שֹׁמְרִים","שְׁמוּרִים"],["f mon.","שֹׁמְרוֹת","שְׁמוּרוֹת"]]],err:"Partisiipista puuttuu persoona: subjekti tulee erikseen (אֲנִי שֹׁמֵר)."},
nifal:{p:["<b>Nifal</b> on yleensä passiivi tai refleksiivi: נִשְׁמַר ’varottiin, varoi itseään’.","Perfektissä etuliite נִ־, imperfektissä נ assimiloituu ja tulee kahdennus: יִשָּׁמֵר."],tbl:[["","Nifal"],[["perf. 3ms","נִשְׁמַר"],["impf. 3ms","יִשָּׁמֵר"],["imperat.","הִשָּׁמֵר"]]],err:"Imperfektin kahdennus ensimmäisessä juurikirjaimessa paljastaa nifalin."},
piel:{p:["<b>Piel</b> tehostaa tai tekee aiheuttavaksi: דִּבֶּר ’puhui’, imperfekti יְדַבֵּר. Tunnusmerkki on <b>keskimmäisen juurikirjaimen kahdennus</b>.","<b>Pual</b> on pielin passiivi (דֻּבַּר) ja <b>hitpael</b> refleksiivi (הִתְהַלֵּךְ ’vaelsi’)."],tbl:[["Vartalo","Perf.","Impf."],[["piel","דִּבֶּר","יְדַבֵּר"],["pual","דֻּבַּר","יְדֻבַּר"],["hitpael","הִתְהַלֵּךְ","יִתְהַלֵּךְ"]]],err:"Imperfektin etuliitteessä on šəwā (יְ), ei ḥīreq."},
hifil:{p:["<b>Hifil</b> on kausatiivi: ’saattaa tekemään’. Perfekti הִ־ ja usein î: הִשְׁמִיד ’tuhosi’, imperfekti יַשְׁמִיד.","<b>Hofal</b> on hifilin passiivi: הָשְׁמַד. Heikoissa: יצא → הוֹצִיא ’vei ulos’, נגד → הִגִּיד ’kertoi’."],tbl:[["Vartalo","Perf.","Impf."],[["hifil","הִשְׁמִיד","יַשְׁמִיד"],["hofal","הָשְׁמַד","יָשְׁמַד"],["hifil I-י","הוֹצִיא","יוֹצִיא"]]],err:"Imperfektin a-etuliite (יַ) erottaa hifilin qalista (יִ)."},
numbers:{p:["Luvut 1 ja 2 mukautuvat sukuun: אֶחָד/אַחַת, שְׁנַיִם/שְׁתַּיִם.","Luvuissa 3–10 suku on <b>käänteinen</b>: maskuliinin kanssa käytetään feminiinimuotoa (שְׁלֹשָׁה בָנִים) ja päinvastoin (שָׁלֹשׁ בָּנוֹת)."],tbl:[["","Maskuliinin kanssa","Feminiinin kanssa"],[["1","אֶחָד","אַחַת"],["2","שְׁנַיִם","שְׁתַּיִם"],["3","שְׁלֹשָׁה","שָׁלֹשׁ"],["7","שִׁבְעָה","שֶׁבַע"],["10","עֲשָׂרָה","עֶשֶׂר"]]],err:"שֶׁבַע שָׁנִים: שָׁנָה on feminiini, joten luku on ”maskuliininen” muoto."},
conj:{p:["Tärkeimmät konjunktiot: <b>כִּי</b> ’että, koska, sillä’, <b>אֲשֶׁר</b> ’joka, mikä’, <b>אִם</b> ’jos’, <b>פֶּן</b> ’ettei’, <b>לְמַעַן</b> ’jotta’, <b>יַעַן</b> ’koska’.","Puoliprepositiot ovat constructus-muotoisia substantiiveja: לִפְנֵי ’edessä’ (kasvojen eteen), בְּתוֹךְ ’keskellä’."],err:"כִּי on monimerkityksinen: tarkista yhteys."}});

function lessonView(tp){const t=TOP[tp];const L=LESSONS[tp]||{};const v=h("div",{class:"view lessv"});v.append(topbar(t.t,()=>go("kirja")));
  v.append(h("div",{class:"lmeta"},h("span",{class:"eyebrow"},`Luku ${t.ch} · ${CH[t.ch]?CH[t.ch].t:""}`),h("span",{class:"small muted"},`kirjassa s. ${t.pg}`),h("span",{class:"mdots"},dots(tp)+(mastered(tp)?" hallussa":""))));
  v.append(h("div",{class:"card lsum"},h("div",{class:"eyebrow"},"Tiiviisti"),h("ul",{class:"list"},t.sum.map(s=>h("li",{html:heWrap(s)})))));
  if(L.p)v.append(h("div",{class:"card"},h("div",{class:"eyebrow"},"Selitys"),...L.p.map(s=>h("p",{html:heWrap(s)}))));
  if(L.tbl){const [hd,rows]=L.tbl;v.append(h("div",{class:"card"},h("div",{class:"eyebrow"},"Taulukko"),h("div",{class:"tscroll"},h("table",{class:"ltab"},h("thead",null,h("tr",null,hd.map(x=>h("th",null,x)))),h("tbody",null,rows.map(r=>h("tr",null,r.map(c=>h("td",/[\u05D0-\u05EA]/.test(c)&&!/[a-zäö]{2}/i.test(c)?{class:"he",lang:"he"}:null,c)))))))))}
  const exs=(t.ex||[]).concat(L.ex||[]);if(exs.length)v.append(h("div",{class:"card"},h("div",{class:"eyebrow"},"Esimerkit"),exs.map(([a,b])=>h("div",{class:"lex"},HE(a,"big"),h("span",{html:heWrap(b)})))));
  if(L.err)v.append(h("div",{class:"card lerr"},h("div",{class:"eyebrow"},"Yleisin virhe"),h("p",{html:heWrap(L.err)})));
  if(t.deep)v.append(h("details",{class:"card"},h("summary",null,h("b",null,"Syventävä: miksi näin?")),h("p",{html:heWrap(t.deep)})));
  v.append(h("div",{class:"row lbtns"},h("button",{class:"btn primary",onclick:()=>drill(tp,true)},"Harjoittele (8 tehtävää)"),h("button",{class:"btn sec",onclick:()=>lesson(tp)},"Mikro-oppitunti")));
  const i=TOPICS.findIndex(x=>x.id===tp);const nx=TOPICS[i+1];if(nx)v.append(h("button",{class:"card nextl",onclick:()=>openLesson(nx.id)},h("span",{class:"small muted"},"Seuraava oppitunti"),h("b",null,`${nx.ch}. ${nx.t}`)));
  app.append(v)}
let LTP=null;function openLesson(tp){LTP=tp;go("oppitunti")}
VIEWS.oppitunti=()=>lessonView(LTP||TOPICS[0].id);
let kirjaQ="";
function vKirja(){const v=h("div",{class:"view"});v.append(topbar("Hakuteos",()=>go("opi")));
